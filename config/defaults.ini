; Defaults for the standard tool options, so they do not have to be typed every time.
; A value given on the command line always wins. Leave a value empty for no default.
;
; Logins do not go in this file: they go in credentials.local.ini (see credentials.example.ini).

; Galaxy to connect to (-Galaxy)
Galaxy=EMGALAXY

; Galaxy Repository node (-Node). Empty means this computer.
Node=
